<style>
:root{
  --bg:#f5efe6; --card:#fffdf9; --ink:#2a2019; --muted:#6f6257; --line:#e4d9ca;
  --coffee:#5b3a24; --coffee2:#8a5a3a;
  --eco:#b07a1c; --soc:#b04a3a; --amb:#3c7a55;
  --good:#2f7a4c; --bad:#b23b2e;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;font-size:17px;line-height:1.5}
h1,h2,h3{font-family:'Fraunces',Georgia,serif;line-height:1.15;margin:0 0 .5em}
button,input{font:inherit}
button{cursor:pointer}
.wrap{max-width:1080px;margin:0 auto;padding:18px 18px 40px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.brand{font-family:'Fraunces',serif;font-weight:700;color:var(--coffee);font-size:1.1rem;display:flex;align-items:center;gap:8px}
.brand svg{width:26px;height:26px}
.pill{background:var(--coffee);color:#fff;border-radius:999px;padding:4px 14px;font-size:.85rem;font-weight:700}
.pill.red{background:var(--bad)}
.pill.light{background:#f3e7d8;color:var(--coffee)}
.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.score{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 13px}
.score .lab{display:flex;justify-content:space-between;font-size:.85rem;font-weight:700;margin-bottom:6px}
.bar{height:10px;background:#efe6da;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .7s ease}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px 26px}
.tag{display:inline-block;font-size:.78rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--coffee2);background:#f3e7d8;border-radius:6px;padding:3px 9px;margin-bottom:12px}
.situ{font-size:1.22rem;margin:0 0 18px}
.opts{display:grid;gap:12px}
.opt{position:relative;overflow:hidden;display:flex;gap:14px;align-items:flex-start;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px 16px;width:100%;color:var(--ink)}
.opt:hover{border-color:var(--coffee2)}
.opt.sel{border-color:var(--coffee);background:#f8efe4}
.opt .k{flex:0 0 38px;height:38px;border-radius:10px;background:var(--coffee);color:#fff;display:grid;place-items:center;font-weight:700;font-size:1.1rem;position:relative;z-index:1}
.opt .t{font-size:1.05rem;padding-top:6px;position:relative;z-index:1;flex:1}
.opt .fill{position:absolute;left:0;top:0;bottom:0;background:#efe2d1;transition:width .5s ease;z-index:0}
.opt .cnt{position:relative;z-index:1;font-weight:700;font-size:1.2rem;padding-top:4px;min-width:3ch;text-align:right;font-variant-numeric:tabular-nums}
.votebar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px dashed var(--line);color:var(--muted);font-size:.95rem}
.timer{display:flex;align-items:center;gap:10px}
.timer b{font-family:'Fraunces',serif;font-size:1.6rem;color:var(--ink);min-width:3ch;text-align:right;font-variant-numeric:tabular-nums}
.btn{border:0;border-radius:12px;padding:11px 20px;font-weight:700;background:var(--coffee);color:#fff}
.btn:hover{background:#462c1b}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--coffee);border:2px solid var(--coffee)}
.btn.ghost:hover{background:#f3e7d8}
.btn.sm{padding:7px 14px;font-size:.9rem}
.btn.big{padding:15px 26px;font-size:1.1rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.right{justify-content:flex-end}
.chosen{font-size:.92rem;color:var(--muted);margin-bottom:6px}
.cons{font-size:1.18rem;margin:4px 0 16px}
.deltas{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.d{border-radius:10px;padding:6px 12px;font-weight:700;font-size:.95rem;border:1px solid var(--line);background:#fff}
.d.up{color:var(--good)} .d.down{color:var(--bad)} .d.zero{color:var(--muted)}
.theory{background:#f7f1e8;border-left:5px solid var(--amb);border-radius:12px;padding:16px 18px;margin-top:6px}
.theory h3{font-size:1.15rem;color:var(--amb)}
.theory p{margin:.3em 0 .8em}
.refs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.ref{background:#fff;border-radius:10px;padding:10px 12px;font-size:.92rem;border:1px solid var(--line)}
.ref b{display:block;font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.q{font-style:italic;font-size:1.05rem;margin-top:10px}
.q::before{content:"Para discutir: ";font-style:normal;font-weight:700;color:var(--coffee)}
.event{border:2px solid var(--bad);background:#fff7f5}
.event .tag{background:var(--bad);color:#fff}
.lesson{background:#fff;border-radius:12px;padding:12px 16px;border:1px solid var(--line);font-weight:500}
.lobby{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
.code{font-family:'Fraunces',serif;font-size:4.2rem;letter-spacing:.12em;color:var(--coffee);line-height:1;margin:6px 0 10px}
.url{background:#fff;border:1px dashed var(--coffee2);border-radius:10px;padding:8px 12px;font-size:.95rem;word-break:break-all}
#qr{margin-top:14px;background:#fff;display:inline-block;padding:10px;border-radius:12px;border:1px solid var(--line)}
#qr:empty{display:none}
.names{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.names span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:.92rem}
.field{display:block;margin:0 0 14px}
.field span{display:block;font-weight:700;font-size:.9rem;margin-bottom:5px}
.field input{width:100%;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:1.1rem}
.field input:focus{outline:none;border-color:var(--coffee2)}
.note{background:#fff8e6;border:1px solid #ecd9a6;border-radius:12px;padding:12px 14px;font-size:.93rem}
.err{color:var(--bad);font-weight:700;margin-top:8px}
.rolecard{background:linear-gradient(135deg,#5b3a24,#8a5a3a);color:#fff;border-radius:18px;padding:20px 22px;margin-bottom:16px}
.rolecard h2{color:#fff;font-size:1.35rem;margin-bottom:.3em}
.rolecard .ico{font-size:2rem}
.rolecard p{margin:.4em 0}
.rolecard.imp{background:linear-gradient(135deg,#2b1d26,#6b2d3a)}
.rolecard.hidden{cursor:pointer;text-align:center}
.small{font-size:.88rem;color:var(--muted)}
.res{width:100%;border-collapse:collapse;font-size:.95rem;margin-top:8px}
.res td,.res th{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.res th{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.ok{color:var(--good);font-weight:700}.no{color:var(--bad);font-weight:700}
.verdict{font-size:1.6rem;color:var(--coffee)}
.big-ok{font-family:'Fraunces',serif;font-size:1.5rem}
ul.tight{margin:.3em 0;padding-left:1.2em} ul.tight li{margin:.25em 0}
details{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:14px}
details summary{cursor:pointer;font-weight:700;color:var(--coffee)}
.switch{display:flex;align-items:center;gap:10px;margin:12px 0}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (max-width:760px){
  html,body{font-size:16px}
  .lobby,.refs{grid-template-columns:1fr}
  .scores{gap:6px}.score{padding:7px 9px}.score .lab{font-size:.74rem}
  .card{padding:18px 16px}
  .situ,.cons{font-size:1.06rem}
  .code{font-size:3rem}
}

/* ---- Reconexión, expulsión, Plan B y accesibilidad ---- */
.names .pl{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 10px;font-size:.92rem;color:var(--ink)}
.names .pl .dot{width:9px;height:9px;border-radius:50%;background:var(--good);flex:none}
.names .pl.off{opacity:.65}.names .pl.off .dot{background:#9a8f85}
.names .pl.dup{border-color:var(--bad);background:#fff1ee}
.names .pl .kick{border:0;background:#efe6da;color:var(--coffee);width:24px;height:24px;border-radius:50%;font-weight:700;line-height:1;padding:0;flex:none}
.names .pl .kick:hover{background:var(--bad);color:#fff}
.names button.pl.award{padding:6px 14px;font:inherit;font-weight:700;cursor:pointer}
.names button.pl.award.on{background:var(--good);border-color:var(--good);color:#fff}
.banner.off{background:#fff1ee;color:var(--bad);border:1px solid #f0c4bb}
.soloopt{display:flex;gap:10px;align-items:stretch}.soloopt .opt{flex:1}
.soloopt .pm{display:flex;flex-direction:column;gap:6px;justify-content:center}.soloopt .pm .btn{min-width:48px;font-size:1.1rem}
.cnt.bump{animation:bump .3s ease}@keyframes bump{50%{transform:scale(1.35)}}
kbd{font-family:inherit;font-size:.82em;background:#fff;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px}
details.planb{margin-top:18px}details.planb p{margin:.6em 0}
.field textarea:focus{outline:none;border-color:var(--coffee2)}
:focus-visible{outline:3px solid #3c6fa0;outline-offset:2px}
.btn:focus-visible,.opt:focus-visible,.qo:focus-visible{outline:3px solid #3c6fa0;outline-offset:3px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
@media (max-width:380px){
  html,body{font-size:15px}.wrap{padding:10px 10px 30px}.card{padding:14px 12px;border-radius:14px}
  .btn.big{padding:12px 14px}.opt{padding:12px 12px;gap:10px}.code{font-size:2.4rem}
  .soloopt{flex-direction:column}.soloopt .pm{flex-direction:row}
}
</style>
<style>
.rival{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#2f2a26;color:#f1e7da;border-radius:12px;padding:7px 14px;margin:-6px 0 16px;font-size:.88rem}
.rival b{color:#fff}
.rival .mini{display:flex;align-items:center;gap:6px}
.rival .mb{width:60px;height:7px;background:#4a423c;border-radius:9px;overflow:hidden}
.rival .mb i{display:block;height:100%;border-radius:9px;transition:width .7s}
.vereda{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:16px;position:relative}
.vereda svg{display:block;width:100%;height:auto}
.vereda .vt{position:absolute;left:12px;top:8px;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#4d5b50;background:rgba(255,255,255,.75);border-radius:6px;padding:2px 8px}
.rgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0}
.rc{background:linear-gradient(135deg,#5b3a24,#8a5a3a);color:#fff;border-radius:16px;padding:16px;text-align:center;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;animation:flipIn .6s both}
.rc .ico{font-size:2.2rem}
.rc b{font-family:'Fraunces',serif;font-size:1.02rem;line-height:1.2}
.rc span{font-size:.8rem;opacity:.85}
.rc.imp{background:linear-gradient(135deg,#2b1d26,#6b2d3a)}
.rc.bot{background:linear-gradient(135deg,#46505a,#6c7884)}
@keyframes flipIn{from{opacity:0;transform:perspective(600px) rotateY(90deg) scale(.9)}to{opacity:1;transform:none}}
.qopts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qo{position:relative;overflow:hidden;border-radius:14px;padding:16px;border:2px solid var(--line);background:#fff;text-align:left;font-size:1.05rem;color:var(--ink);display:flex;gap:12px;align-items:center;width:100%}
.qo .k{flex:0 0 34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#fff;font-weight:700}
.qo.c0 .k{background:#b04a3a}.qo.c1 .k{background:#3c6fa0}.qo.c2 .k{background:#b07a1c}.qo.c3 .k{background:#3c7a55}
.qo.right{border-color:var(--good);background:#eef8f1}
.qo.wrong{opacity:.5}
.qo.sel{border-color:var(--coffee);background:#f8efe4}
.qo .cnt{margin-left:auto;font-weight:700;font-size:1.15rem}
.qtimer{font-family:'Fraunces',serif;font-size:2.2rem;color:var(--coffee);font-variant-numeric:tabular-nums}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:14px;margin:16px 0 8px}
.pod{text-align:center;width:150px}
.pod .nm{font-weight:700;margin-bottom:6px;word-break:break-word}
.pod .blk{border-radius:12px 12px 0 0;color:#fff;font-family:'Fraunces',serif;font-size:2rem;display:flex;align-items:flex-start;justify-content:center;padding-top:10px}
.pod .pts{font-size:.9rem;color:var(--muted);margin-top:4px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.cmp>div{border-radius:14px;padding:14px;border:1px solid var(--line);background:#fff}
.cmp .dark{background:#2f2a26;color:#f1e7da;border-color:#2f2a26}
.cmp h4{margin:0 0 6px;font-family:'Fraunces',serif;font-size:1.1rem}
.cmp .ln{display:flex;justify-content:space-between;font-size:.95rem}
#overlay{position:fixed;inset:0;background:rgba(30,20,14,.78);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
#overlay.on{display:flex}
.wheelbox{background:var(--card);border-radius:22px;padding:22px;text-align:center;max-width:560px;width:100%}
.wheelwrap{position:relative;width:min(420px,80vw);height:min(420px,80vw);margin:10px auto}
.wheelwrap svg.w{width:100%;height:100%;transition:transform 4.6s cubic-bezier(.33,1,.68,1)}
.pointer{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:30px solid var(--coffee);filter:drop-shadow(0 2px 2px rgba(0,0,0,.3));z-index:2}
.winner{font-family:'Fraunces',serif;font-size:1.8rem;color:var(--coffee);min-height:2.4rem}
.banner{border-radius:14px;padding:14px 16px;margin-bottom:14px;font-weight:700;text-align:center}
.banner.me{background:var(--coffee);color:#fff;font-size:1.15rem;animation:pulse 1s ease 3}
.banner.other{background:#f3e7d8;color:var(--coffee)}
@keyframes pulse{50%{transform:scale(1.03)}}
@media (max-width:760px){.rgrid{grid-template-columns:1fr 1fr}.qopts,.cmp{grid-template-columns:1fr}.pod{width:100px}}
</style>

<style>
/* ======== Capa visual renovada ======== */
html,body{background:
  radial-gradient(1200px 500px at 10% -10%,#fbe7cf 0%,transparent 60%),
  radial-gradient(900px 500px at 110% 10%,#e3efd9 0%,transparent 55%),
  #f4ece1;background-attachment:fixed}
.wrap{max-width:1180px}
.top{padding:10px 14px;background:rgba(255,253,249,.7);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:16px;box-shadow:0 4px 16px rgba(91,58,36,.06)}
.brand{font-size:1.25rem}
.brand svg{width:34px;height:34px;background:#5b3a24;border-radius:10px;padding:5px;stroke:#fff}
.brand svg path{stroke:#fff}
.card{border:none;border-radius:22px;box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 10px 30px rgba(91,58,36,.10),0 2px 6px rgba(91,58,36,.06)}
.tag{border-radius:999px;padding:4px 12px;background:#efe0cc}
.situ{font-family:'Fraunces',serif;font-weight:500;font-size:1.42rem;line-height:1.35}
.btn{box-shadow:0 4px 0 #3b2416;transition:transform .08s,box-shadow .08s,background .15s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #3b2416}
.btn.ghost{box-shadow:none}
.btn:disabled{box-shadow:none}
.opt{border-radius:16px;box-shadow:0 3px 0 #e4d6c3;transition:transform .15s,box-shadow .15s,border-color .15s}
.opt:hover{transform:translateY(-2px);box-shadow:0 6px 0 #d8c6af}
.opt .k{border-radius:12px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.opts .opt:nth-child(1) .k{background:#b04a3a}.opts .opt:nth-child(2) .k{background:#3c6fa0}.opts .opt:nth-child(3) .k{background:#b07a1c}
.opt .fill{background:linear-gradient(90deg,#f1e2cf,#ead6bd)}
/* marcadores */
.scores{gap:12px}
.score{border:none;border-radius:16px;padding:12px 16px 14px;box-shadow:0 6px 18px rgba(91,58,36,.08);position:relative;overflow:visible}
.score .lab{font-size:.92rem;align-items:center}
.score .num{font-family:'Fraunces',serif;font-size:1.5rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.score .bar{height:12px;background:#f0e7db;box-shadow:inset 0 1px 2px rgba(0,0,0,.08)}
.score .bar i{background-image:linear-gradient(90deg,rgba(255,255,255,.25),rgba(255,255,255,0))!important}
.score .bar i.eco{background-color:var(--eco)}.score .bar i.soc{background-color:var(--soc)}.score .bar i.amb{background-color:var(--amb)}
.score .mark{position:absolute;top:28px;bottom:14px;width:2px;background:rgba(0,0,0,.18);border-radius:2px}
.dfloat{position:absolute;right:14px;top:-12px;font-weight:800;font-size:1rem;padding:3px 10px;border-radius:999px;animation:dfl 2.4s ease forwards;pointer-events:none}
.dfloat.up{background:#e3f4e8;color:var(--good)}.dfloat.down{background:#fbe5e2;color:var(--bad)}
@keyframes dfl{0%{opacity:0;transform:translateY(8px) scale(.8)}15%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
/* vereda */
.vereda{border:none;border-radius:22px;box-shadow:0 10px 30px rgba(40,60,40,.14)}
.vereda .vt{left:16px;top:12px;font-size:.74rem;background:rgba(255,255,255,.85);border-radius:999px;padding:4px 12px}
.vlegend{display:flex;gap:16px;flex-wrap:wrap;padding:7px 16px;background:#fbf7f0;font-size:.78rem;color:var(--muted);border-top:1px solid #efe5d6}
.vereda .cloud{animation:drift 80s linear infinite}
.vereda .cloud.c1{animation-duration:90s;animation-delay:-20s}
.vereda .cloud.c2{animation-duration:70s;animation-delay:-50s}
.vereda .cloud.c3{animation-duration:110s;animation-delay:-35s}
@keyframes drift{from{transform:translateX(-150px)}to{transform:translateX(1350px)}}
.vereda .sunglow{animation:sunp 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes sunp{50%{scale:1.12;opacity:.85}}
.vereda .smoke circle{fill:#e9e4dc;opacity:.0;animation:smk 4s ease-out infinite;transform-box:fill-box;transform-origin:center}
.vereda .smoke.dark circle{fill:#5a524c}
.vereda .smoke circle:nth-child(2){animation-delay:1.3s}.vereda .smoke circle:nth-child(3){animation-delay:2.6s}
@keyframes smk{0%{opacity:0;transform:translateY(6px) scale(.6)}30%{opacity:.85}100%{opacity:0;transform:translateY(-22px) scale(1.4)}}
.vereda .ripple{stroke-dasharray:12 10;animation:rip 3s linear infinite}
@keyframes rip{to{stroke-dashoffset:-44}}
.vereda .fish{animation:jump 3.6s ease-in-out infinite;transform-box:fill-box}
@keyframes jump{0%,60%,100%{translate:0 0}75%{translate:10px -16px}85%{translate:18px -4px}}
.vereda .birds{animation:birds 26s linear infinite}

// Modo local: guarda todo en localStorage y avisa a las otras pestañas.
const LocalDB=(()=>{
  const KEY='rse_local_db'; let subs=[];
  const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}};
  const at=(t,p)=>p.split('/').reduce((o,k)=>(o==null?undefined:o[k]),t);
  const fire=()=>{const t=load();subs.forEach(s=>{let v=at(t,s.p);if(v===undefined)v=null;const j=JSON.stringify(v);if(j!==s.last){s.last=j;s.cb(JSON.parse(j));}});};
  window.addEventListener('storage',e=>{if(e.key===KEY)fire();});
  const api={
    set(p,v){const t=load();const ks=p.split('/');let o=t;for(let i=0;i<ks.length-1;i++){if(typeof o[ks[i]]!=='object'||o[ks[i]]===null)o[ks[i]]={};o=o[ks[i]];}
      if(v===null||v===undefined)delete o[ks[ks.length-1]];else o[ks[ks.length-1]]=v;
      try{localStorage.setItem(KEY,JSON.stringify(t));}catch(e){} fire(); return Promise.resolve();},
    on(p,cb){const s={p,cb,last:undefined};subs.push(s);setTimeout(fire,0);return()=>{subs=subs.filter(x=>x!==s);};},
    get(p){const v=at(load(),p);return Promise.resolve(v===undefined?null:v);},
    // Presencia: cada pestaña escribe la hora cada 5 s; al cerrarse, se borra.
    presence(p){const beat=()=>api.set(p,Date.now());beat();const iv=setInterval(beat,5000);const bye=()=>api.set(p,null);
      window.addEventListener('pagehide',bye);return()=>{clearInterval(iv);window.removeEventListener('pagehide',bye);api.set(p,null);};},
    alive(v){return !!v&&Date.now()-v<75000;}, // las pestañas en segundo plano laten más lento
    onConn(cb){cb(true);return()=>{};}
  };
  return api;
})();
let DB=null, DB_MAIN=null, MODE='local', FB_FAIL=false;
function withTimeout(pr,ms){return Promise.race([pr,new Promise((_,ko)=>setTimeout(()=>ko(new Error('tiempo agotado')),ms))]);}
async function initDB(){
  if(FIREBASE_CONFIG&&FIREBASE_CONFIG.databaseURL){
    try{
      await withTimeout(loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js'),10000);
      await withTimeout(loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js'),10000);
      firebase.initializeApp(FIREBASE_CONFIG);
      const d=firebase.database();
      const conn=d.ref('.info/connected');
      DB={set:(p,v)=>d.ref(p).set(v===undefined?null:v),
          on:(p,cb)=>{const h=s=>cb(s.val());d.ref(p).on('value',h,err=>showFatal("Firebase rechazó la conexión: "+err.message+". Revisa las reglas de la base de datos (paso 4 de GUIA_FIREBASE.md)."));return()=>d.ref(p).off('value',h);},
          get:(p)=>d.ref(p).get().then(s=>s.val()),
          // Presencia real: Firebase borra la marca apenas se corta la conexión (onDisconnect).
          presence:(p)=>{const ref=d.ref(p);const h=s=>{if(s.val()===true){ref.onDisconnect().remove();ref.set(firebase.database.ServerValue.TIMESTAMP);}};
            conn.on('value',h);return()=>{conn.off('value',h);ref.onDisconnect().cancel();ref.remove();};},
          alive:(v)=>!!v,
          onConn:(cb)=>{const h=s=>cb(s.val()===true);conn.on('value',h);return()=>conn.off('value',h);}};
      DB_MAIN=DB; MODE='firebase'; return;
    }catch(e){ console.error(e); FB_FAIL=true; }
  }
  DB=DB_MAIN=LocalDB; MODE='local';
}

const SFX=(()=>{
  let ctx=null, muted=false, susp=null;
  const ac=()=>{try{if(!ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;ctx=new C();}if(ctx.state==='suspended')ctx.resume();return ctx;}catch(e){return null}};
  function tone(f,dur,o={}){
    if(muted)return; const c=ac(); if(!c)return;
    const t=c.currentTime+(o.at||0), osc=c.createOscillator(), g=c.createGain();
    osc.type=o.type||'sine'; osc.frequency.setValueAtTime(f,t);
    if(o.slide)osc.frequency.exponentialRampToValueAtTime(o.slide,t+dur);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(o.vol||.2,t+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    osc.connect(g); g.connect(c.destination); osc.start(t); osc.stop(t+dur+0.03);
  }
  return {
    unlock(){ac();},
    tick(){tone(1400,.035,{type:'square',vol:.05});},
    flip(){tone(420,.14,{type:'triangle',vol:.16,slide:980});},
    reveal(){[523,659,784].forEach((f,i)=>tone(f,.28,{type:'triangle',vol:.17,at:i*.09}));},
    good(){[659,880,1175].forEach((f,i)=>tone(f,.22,{type:'sine',vol:.2,at:i*.1}));},
    bad(){tone(330,.45,{type:'sawtooth',vol:.1,slide:140});tone(220,.5,{type:'triangle',vol:.12,at:.05,slide:110});},
    alarm(){for(let i=0;i<4;i++){tone(880,.17,{type:'square',vol:.09,at:i*.36});tone(660,.17,{type:'square',vol:.09,at:i*.36+.18});}},
    sad(){[392,349,311,262].forEach((f,i)=>tone(f,.45,{type:'triangle',vol:.16,at:i*.32}));},
    gong(){tone(196,1.2,{type:'sine',vol:.25});tone(294,1,{type:'triangle',vol:.08});},
    fanfare(){[523,659,784,1047].forEach((f,i)=>tone(f,.34,{type:'triangle',vol:.2,at:i*.15}));tone(784,.9,{type:'triangle',vol:.16,at:.62});tone(1047,.9,{type:'triangle',vol:.2,at:.62});},
    suspenseStart(secs){this.suspenseStop();let n=0;const total=secs*2;
      susp=setInterval(()=>{n++;const late=n>total-20;tone(late?185:110,.16,{type:'sine',vol:late?.2:.13});if(n%2===0)tone(late?277:165,.09,{type:'triangle',vol:.06});if(n>=total)this.suspenseStop();},500);},
    suspenseStop(){if(susp){clearInterval(susp);susp=null;}},
    toggle(){muted=!muted;if(muted)this.suspenseStop();return muted;},
    get muted(){return muted;}
  };
})();

function rivalStep(r){
  const V=H.rival, R=ROUNDS[r]; let bi=0, be=-1e9, bfx=null;
  R.opts.forEach((o,i)=>{const fx=o.dyn?o.dyn(V.flags.length,""):o; if(fx.e>be){be=fx.e;bi=i;bfx=fx;}});
  if(r===ROUNDS.length-1){bi=0;bfx=R.opts[0].dyn(0,"");}
  const o=R.opts[bi]; if(o.flag&&!V.flags.includes(o.flag))V.flags.push(o.flag);
  V.sc={e:clamp(V.sc.e+bfx.e),s:clamp(V.sc.s+bfx.s),a:clamp(V.sc.a+bfx.a)};
}
/* ------------------ RULETA DE LAS CONSECUENCIAS ------------------
   Después de las rondas 4 y 7 se gira una ruleta. Casillas:
   · cada decisión turbia pendiente: 2 casillas (escándalo);
   · cada buena decisión aún sin premio: 1 casilla (buena noticia);
   · factores externos: «Sube el precio del café» y «Lluvias fuertes», 1 casilla cada uno;
   · 2 casillas de «Sin novedad».
   Sale un solo resultado por ruleta. Lo que no sale sigue en juego después. */
const RISK_SHORT={conflicto:"Conflicto",infantil:"Trab. infantil",informal:"Informalidad",vertimiento:"Vertimiento",soborno:"Soborno",greenwashing:"Greenwashing"};
const RISK_PER_FLAG=2, RISK_SAFE=2;
const GOOD_EVENTS={
  g0:{short:"Transparencia",t:"La licitación transparente se vuelve ejemplo",txt:"La Cámara de Comercio invita a Café Andino a contar su protocolo de conflictos de interés. Dos clientes nuevos llegan por la buena reputación.",e:3,s:2,a:0,l:"La buena gobernanza genera confianza, y la confianza atrae negocios (Gobernanza)."},
  g1:{short:"Cadena limpia",t:"Un comprador europeo elige a Café Andino",txt:"Un importador europeo exige pruebas de que no hay trabajo infantil en la cadena de suministro. Café Andino puede demostrarlo y gana el contrato.",e:5,s:1,a:0,l:"La debida diligencia en la cadena de suministro abre mercados exigentes (Derechos humanos)."},
  g2:{short:"Buen empleo",t:"Los recolectores recomiendan la finca",txt:"En plena cosecha, cuando a otras fincas les faltan manos, a Café Andino le sobran recolectores: los que tuvieron contrato formal trajeron a sus vecinos.",e:3,s:3,a:0,l:"El trabajo decente reduce la rotación y asegura la cosecha (Prácticas laborales)."},
  g3:{short:"Agua limpia",t:"La quebrada vuelve a tener vida",txt:"La autoridad ambiental pone el sistema de tratamiento de Café Andino como ejemplo para otras fincas, y el abono de pulpa reduce aún más los costos.",e:2,s:1,a:3,l:"Prevenir la contaminación también ahorra costos y mejora la relación con la autoridad (Medio ambiente)."},
  g4:{short:"Juego limpio",t:"Un contrato público por historial limpio",txt:"Una alcaldía abre una compra de café para sus programas de alimentación escolar. Café Andino gana porque puede demostrar que nunca pagó sobornos.",e:5,s:1,a:0,l:"La integridad es un activo: hay negocios que solo se ganan con un historial limpio (Prácticas justas de operación)."},
  g5:{short:"Etiqueta clara",t:"Los clientes premian la transparencia",txt:"Un video de alguien que escanea el código QR de la etiqueta se vuelve viral por las razones correctas. Las tiendas especializadas piden más café.",e:4,s:2,a:0,l:"La información veraz construye lealtad en los consumidores (Asuntos de consumidores)."},
  g6:{short:"Becarios",t:"Un becario mejora la calidad del café",txt:"Uno de los becarios de la vereda, ahora técnico de calidad, ajusta el proceso de fermentación. El café sube de categoría y se vende mejor.",e:4,s:2,a:0,l:"Invertir en la comunidad también fortalece a la empresa (Participación y desarrollo de la comunidad)."}
};
const MARKET_EVENTS={
  m_precio:{short:"Precio sube",t:"Sube el precio internacional del café",txt:"Una mala cosecha en otros países hace subir el precio del café. Todas las fincas venden mejor este trimestre.",e:4,s:0,a:0,l:"Hay factores externos que la empresa no controla: la RSE no elimina el azar del mercado."},
  m_lluvia:{short:"Lluvias",t:"Temporada de lluvias fuertes",txt:"Un invierno más fuerte de lo normal daña caminos y parte de la cosecha.",e:-3,s:0,a:-2,l:"El cambio climático es un riesgo para el negocio; por eso los inversionistas preguntan por la gestión ambiental (ESG)."}
};
function segKind(k){return k==='safe'?'safe':k in GOOD_EVENTS?'good':k in MARKET_EVENTS?'market':'scandal';}
function segShort(k){const kd=segKind(k);return kd==='safe'?'Sin novedad':kd==='good'?GOOD_EVENTS[k].short:kd==='market'?MARKET_EVENTS[k].short:RISK_SHORT[k];}
// el evento con sus efectos; las lluvias golpean menos a quien cuida el suelo y el agua
function evInfo(k,sc){
  const kd=segKind(k); if(kd==='scandal')return Object.assign({kind:kd},EVENTS[k]); if(kd==='good')return Object.assign({kind:kd},GOOD_EVENTS[k]);
  if(k==='m_lluvia'&&sc&&sc.a>=60)return Object.assign({},MARKET_EVENTS[k],{kind:kd,e:-1,a:0,txt:MARKET_EVENTS[k].txt+" Gracias a su buen manejo del suelo y de la quebrada, Café Andino resiste mejor que sus vecinos."});
  return Object.assign({kind:kd},MARKET_EVENTS[k]);
}
function goodPending(log,bonus){return (log||[]).filter(l=>l.n<=7&&DECISION_TAGS[l.n-1]&&(DECISION_TAGS[l.n-1][l.i]||[])[1]==='good').map(l=>'g'+(l.n-1)).filter(g=>!(bonus||[]).includes(g));}
function arrangeSegs(segs){
  const out=[]; const pool=shuffle(segs.slice()); while(pool.length){let i=pool.findIndex(x=>x!==out[out.length-1]);if(i<0)i=0;out.push(pool.splice(i,1)[0]);}
  if(out.length>2&&out[0]===out[out.length-1]){const j=out.findIndex((x,i)=>i>0&&x!==out[0]&&out[i-1]!==out[out.length-1]);if(j>0)[out[0],out[j]]=[out[j],out[0]];}
  return out;
}
function riskSegments(flags,goods){
  const segs=[]; flags.forEach(f=>{for(let k=0;k<RISK_PER_FLAG;k++)segs.push(f);}); goods.forEach(g=>segs.push(g));
  segs.push('m_precio','m_lluvia'); for(let k=0;k<RISK_SAFE;k++)segs.push('safe');
  return arrangeSegs(segs);
}
function pendingRisks(fl,fi){return fl.filter(f=>!fi.includes(f));}
function rivalEvents(r){
  const V=H.rival; if(!EVENT_CHECKS[r])return;
  const segs=riskSegments(pendingRisks(V.flags,V.fired),[]); const f=segs[Math.floor(Math.random()*segs.length)];
  if(f&&f!=='safe'){const ev=evInfo(f,V.sc); if(ev.kind==='scandal')V.fired.push(f); V.sc={e:clamp(V.sc.e+ev.e),s:clamp(V.sc.s+ev.s),a:clamp(V.sc.a+ev.a)};}
}
function riskNote(L,ronda,fired){
  if(!L)return ""; const when=ronda<3?"después de la ronda 4":ronda===3||ronda===6?"al terminar esta ronda":ronda<6?"después de la ronda 7":"";
  if(!when)return "";
  if(L.flag&&!(fired||[]).includes(L.flag))return `<div class="risknote" role="note">⚠ <b>Esta decisión entra a la ruleta de las consecuencias como riesgo.</b> Puede salir a la luz cuando se gire, ${when}.</div>`;
  const tg=DECISION_TAGS[ronda]&&DECISION_TAGS[ronda][L.i];
  if(tg&&tg[1]==='good')return `<div class="risknote good" role="note">✓ <b>Esta decisión entra a la ruleta de las consecuencias como posible buena noticia.</b> Se gira ${when}.</div>`;
  return "";
}
function rivalHTML(){
  if(!H||!H.rival||H.fase==='lobby'||H.fase==='roles')return "";
  const v=H.rival.sc, it=[["E","e","#d9a441"],["S","s","#d9725f"],["A","a","#6fb08a"]];

}

let H=null, players={}, roles={}, votes={}, quizAns={}, alive={}, hostUnsubs=[], hostOnline=true;

  hostUnsubs.push(DB.on(hostPath('vivo'),v=>{alive=v||{}; if(H&&H.fase==='lobby')updateLobby(); hostRender(true,true);}));

function isOn(pid){return H&&H.solo?true:DB.alive(alive[pid]);}
function onlineCount(){return Object.keys(players).filter(isOn).length;}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function lateRoles(){
  if(!H||H.fase==='lobby')return;
  Object.keys(players).forEach(id=>{ if(!roles[id]){
    const cnt={};ROLE_KEYS.forEach(k=>cnt[k]=0);Object.values(roles).forEach(k=>{if(cnt[k]!==undefined)cnt[k]++;});

function voteCounts(){const v=votes['r'+H.ronda]||{};const c=[0,0,0];Object.keys(v).forEach(pid=>{const i=v[pid];if(c[i]!==undefined&&players[pid])c[i]++;});

  const mv=(H.manual||{})['r'+H.ronda]; if(mv)mv.forEach((x,i)=>c[i]+=x); return c;}
function totalPlayers(){return Object.keys(players).length+((H&&H.bots)?H.bots.length:0);}
function majority(){const c=voteCounts();const m=Math.max(...c);if(m===0)return -1;const w=c.map((x,i)=>x===m?i:-1).filter(i=>i>=0);return w.length===1?w[0]:-2;}
function botChoice(bot){
  const r=ROUNDS[H.ronda], w=BOT_W[bot.role]; let best=0,bs=-1e9;
  r.opts.forEach((o,i)=>{const fx=o.dyn?o.dyn(H.flags.length,""):o;
    const sc=w.e*(fx.e||0)+w.s*(fx.s||0)+w.a*(fx.a||0)-(o.flag?w.f:0)+(Math.random()*8-4);
    if(sc>bs){bs=sc;best=i;}});
  return best;
}
let botTimers=[];
function scheduleBots(){
  botTimers.forEach(clearTimeout); botTimers=[];
  if(!H||H.fase!=='dilema'||!H.bots||!H.bots.length)return;
  const r=H.ronda, key='r'+r;
  H.bots.forEach(b=>{ if(H.botVotes[key]&&H.botVotes[key][b.id]!==undefined)return;
    botTimers.push(setTimeout(()=>{ if(!H||H.fase!=='dilema'||H.ronda!==r)return;
      (H.botVotes[key]=H.botVotes[key]||{})[b.id]=botChoice(b); saveHost(); hostRender(true);
    },2500+Math.random()*7000));});
}
function hostChoose(i){
  closeOverlay();
  const r=ROUNDS[H.ronda], o=r.opts[i]; let fx;
  if(o.dyn){const bad=H.flags.length;const list=H.flags.map(f=>FLAGNAMES[f]).join(", ");fx=o.dyn(bad,list);}
  else fx={e:o.e,s:o.s,a:o.a,c:o.c};
  if(o.flag&&!H.flags.includes(o.flag))H.flags.push(o.flag);
  if(H.ronda===ROUNDS.length-1)H.finalChoice=i;
  H.sc={e:clamp(H.sc.e+fx.e),s:clamp(H.sc.s+fx.s),a:clamp(H.sc.a+fx.a)};
  const c=voteCounts();
  H.last={i,c:fx.c,fx:{e:fx.e,s:fx.s,a:fx.a},votes:c,flag:o.flag||null};
  H.log.push({n:H.ronda+1,m:r.materia,k:"ABC"[i],i,t:o.t,votes:c,fx:{e:fx.e,s:fx.s,a:fx.a}});

function quizCounts(){const a=quizAns['q'+H.quiz.n]||{};const c=[0,0,0,0];let n=0;Object.keys(a).forEach(pid=>{if(players[pid]&&c[a[pid]]!==undefined){c[a[pid]]++;n++;}});return {c,n};}

const SEG_COLORS={scandal:['#a33b2e','#8a2f45','#b0572a','#7a3b2e','#9c4a1f','#6e3550'],good:['#2f7a4c','#3c8a5c','#256b48','#4a8f4f','#2e6f5e','#3f7f3a','#2b6a55'],market:{m_precio:'#b07a1c',m_lluvia:'#3c6fa0'},safe:'#8a7d70'};

function hostNextEvent(){

const WHEEL_COLORS=["#5b3a24","#b07a1c","#3c7a55","#b04a3a","#3c6fa0","#8a5a3a","#6b4a7a","#4d7a70"];
function ensureOverlay(){let o=document.getElementById('overlay');if(!o){o=document.createElement('div');o.id='overlay';document.body.appendChild(o);}return o;}
function closeOverlay(){const o=document.getElementById('overlay');if(o)o.className='';}
function wheelList(){return Object.keys(players).map(id=>({id,n:players[id].n}));}
function wheelSVG(list){
  const N=Math.max(1,list.length), seg=360/N, R=200, C=210; let paths="";
  list.forEach((p,i)=>{
    const a0=i*seg*Math.PI/180, a1=(i+1)*seg*Math.PI/180;
    const x0=C+R*Math.sin(a0), y0=C-R*Math.cos(a0), x1=C+R*Math.sin(a1), y1=C-R*Math.cos(a1), mid=(i+.5)*seg;
    paths+= N===1?`<circle cx="${C}" cy="${C}" r="${R}" fill="${WHEEL_COLORS[0]}"/>`
      :`<path d="M${C},${C} L${x0},${y0} A${R},${R} 0 ${seg>180?1:0} 1 ${x1},${y1} Z" fill="${p.c||WHEEL_COLORS[i%WHEEL_COLORS.length]}" stroke="#fffdf9" stroke-width="2"/>`;
    const fs=N>18?10:N>10?13:16, nm=p.n.length>14?p.n.slice(0,13)+"…":p.n;
    paths+=`<g transform="rotate(${mid} ${C} ${C})"><text x="${C}" y="${C-R+16}" text-anchor="start" font-size="${fs}" font-weight="700" fill="#fff" font-family="DM Sans,sans-serif" transform="rotate(90 ${C} ${C-R+16})" dominant-baseline="middle">${esc(nm)}</text></g>`;
  });
  return `<svg class="w" id="wheel" viewBox="0 0 420 420"><circle cx="${C}" cy="${C}" r="${R+8}" fill="#5b3a24"/>${paths}${[...Array(24)].map((_,i)=>{const a=i*15*Math.PI/180;return `<circle cx="${C+(R+4)*Math.sin(a)}" cy="${C-(R+4)*Math.cos(a)}" r="2.6" fill="#f2c230"/>`}).join("")}<circle cx="${C}" cy="${C}" r="28" fill="#fffdf9" stroke="#5b3a24" stroke-width="4"/><text x="${C}" y="${C+7}" text-anchor="middle" font-size="20">☕</text></svg>`;
}
let spinning=false;
function spinWheel(n,win,done){
  spinning=true; const w=document.getElementById('wheel'), seg=360/n;
  w.style.transition="none"; w.style.transform="rotate(0deg)"; void w.getBoundingClientRect();
  const theta=360*6+(360-(win+.5)*seg)+(Math.random()*seg*.6-seg*.3);
  w.style.transition=""; requestAnimationFrame(()=>requestAnimationFrame(()=>{w.style.transform=`rotate(${theta}deg)`;}));
  const T=4600; let last=0;
  for(let t=0;t<=T;t+=15){const ang=theta*(1-Math.pow(1-t/T,3)), sIdx=Math.floor(ang/seg); if(sIdx!==last){last=sIdx;setTimeout(()=>SFX.tick(),t);}}
  setTimeout(()=>{spinning=false;done();},T+100);
}

const STEP_NAMES=["Gobernanza","DD. HH.","Laboral","Ambiente","Op. justa","Consumidores","Comunidad","ESG y BIC"];
function impactOf(fx){if(!fx)return '';const v=[fx.e,fx.s,fx.a],pos=v.filter(x=>x>0).length,neg=v.filter(x=>x<0).length;return neg===0&&pos>0?'good':pos===0&&neg>0?'bad':(fx.e+fx.s+fx.a>=0?'mixed':'bad');}
function stepsHTML(){
  const cur=['dilema','consecuencia','quiz','riesgo','evento'].includes(H.fase)?H.ronda:-1;
  const lbl={good:'impacto positivo',bad:'impacto negativo',mixed:'impacto mixto'};
  return `<ol class="steps" aria-label="Progreso de la partida">${STEP_NAMES.map((n,i)=>{const L=(H.log||[]).find(x=>x.n===i+1);
    const o=L&&ROUNDS[i].opts[L.i], fx=L?(L.fx||(o.dyn?null:o)):null, imp=impactOf(fx);
    const cls=L?'done '+imp:(i===cur?'cur':'');
    return `<li class="${cls}" ${i===cur?'aria-current="step"':''} title="${ROUNDS[i].materia} (${i<7?'ISO 26000, materia '+(i+1):'ronda final'})${L?' · eligieron '+L.k+(imp?' ('+lbl[imp]+')':''):''}"><b>${L?(imp==='good'?'✓':imp==='bad'?'✗':'≈'):i+1}</b><span>${n}</span></li>`;}).join("")}</ol>`;
}
function hostTop(){

function updateLobby(){

  const ids=Object.keys(players).sort((a,b)=>players[a].t-players[b].t);
  const cnt={}; ids.forEach(id=>{const k=normName(players[id].n);cnt[k]=(cnt[k]||0)+1;});
  el.innerHTML=ids.length?ids.map(id=>{const p=players[id], on=isOn(id), dup=cnt[normName(p.n)]>1;
    return `<span class="pl ${on?'':'off'} ${dup?'dup':''}" title="${on?'Conectado':'Sin conexión'}${dup?' · nombre repetido':''}"><i class="dot" aria-hidden="true"></i>${esc(p.n)}${dup?' <b aria-label="nombre repetido">⚠</b>':''}<button class="kick" onclick="hostKick('${id}')" aria-label="Sacar a ${esc(p.n)} de la sala" title="Sacar de la sala">×</button></span>`;}).join("")
    :`<span class="small" style="border:0;background:none">Esperando jugadores…</span>`;
  const c=document.getElementById('ncount'); if(c)c.textContent=ids.length;
  const b=document.getElementById('startBtn'); if(b)b.disabled=!(ids.length||H.botsOn);
  const bi=document.getElementById('botinfo'); const ns=ids;
  if(bi){const miss=Math.max(0,ROLE_KEYS.length-ns.length);
    bi.textContent=H.botsOn?(miss>0?`Si faltan estudiantes, la máquina ocupa los cargos vacíos (ahora serían unos ${Math.min(miss,ROLE_KEYS.length)} bots) y vota según los intereses de cada rol.`:"Hay estudiantes para todos los cargos: no hacen falta bots."):"Sin bots: solo votan los estudiantes.";}
}
function updateVotes(){

  c.forEach((x,i)=>{const f=document.getElementById('f'+i),k=document.getElementById('c'+i);if(f)f.style.width=(tot?x/mx*100:0)+'%';if(k)k.textContent=x;});

async function playerJoin(){
  const code=(document.getElementById('jcode').value||"").trim().toUpperCase();
  const name=(document.getElementById('jname').value||"").trim().replace(/\s+/g,' ');
  if(code.length!==4)return playerJoinScreen(code,"El código tiene 4 caracteres.");
  if(name.length<2)return playerJoinScreen(code,"Escribe tu nombre (al menos 2 letras).");
  const btn=document.getElementById('joinBtn'); if(btn){btn.disabled=true;btn.textContent="Conectando…";}
  let pub,jug,viv;
  try{ [pub,jug,viv]=await withTimeout(Promise.all([DB.get(`salas/${code}/pub`),DB.get(`salas/${code}/jugadores`),DB.get(`salas/${code}/vivo`)]),12000); }
  catch(e){ return playerJoinScreen(code,"No hay conexión con el servidor del juego. Revisa tu internet e inténtalo de nuevo."); }
  if(!pub)return playerJoinScreen(code,"No existe una sala con ese código.");
  jug=jug||{}; viv=viv||{}; const nn=normName(name);
  // 1) ¿Esta pestaña o este navegador ya tenían un jugador con ese nombre?  2) ¿Hay un jugador desconectado con ese nombre?
  let pid=[ss('rse_pid_'+code),ls('rse_pid_'+code)].find(id=>id&&jug[id]&&normName(jug[id].n)===nn)||null, back=!!pid;
  if(!pid){
    const same=Object.keys(jug).find(id=>normName(jug[id].n)===nn);
    if(same){
      if(DB.alive(viv[same]))return playerJoinScreen(code,`Ya hay alguien conectado como «${jug[same].n}». Si eres tú en otro dispositivo, cierra esa pestaña y vuelve a intentarlo en un minuto. Si no eres tú, agrega tu apellido o una inicial.`);
      pid=same; back=true;
    }
  }
  if(!pid){ pid='p'+rnd(8); await DB.set(`salas/${code}/jugadores/${pid}`,{n:name,t:Date.now()}); }
  ss('rse_pid_'+code,pid); ls('rse_pid_'+code,pid); ss('rse_name',name); ls('rse_name',name);
  playerStart(code,pid,back?jug[pid].n:name,back);
}
async function playerResume(code,pid,name){
  try{ const j=await withTimeout(DB.get(`salas/${code}/jugadores/${pid}`),12000); if(j&&j.n)return playerStart(code,pid,j.n,true); }catch(e){}
  playerJoinScreen(code);
}
function playerStart(code,pid,name,back){
  P.unsubs.forEach(u=>u()); P.vUn&&P.vUn(); P.qUn&&P.qUn();
  P={code,pid,name,role:null,pub:null,unsubs:[],showRole:false,vib:0,back:!!back,seen:false,online:true,vk:null,qk:null,mv:null,ma:null,pend:{}};
  ss('rse_last',code);
  P.unsubs.push(DB.on(`salas/${code}/jugadores/${pid}`,v=>{ if(v){P.seen=true; if(v.n&&v.n!==P.name){P.name=v.n;playerRender();}} else if(P.seen) playerKicked(); }));
  P.unsubs.push(DB.presence(`salas/${code}/vivo/${pid}`));
  P.unsubs.push(DB.onConn(ok=>{ if(P.online!==ok){P.online=ok; playerRender();} }));
  P.unsubs.push(DB.on(`salas/${code}/pub`,v=>{P.pub=parse(v);syncMine();playerRender();}));
  P.unsubs.push(DB.on(`salas/${code}/roles/${pid}`,v=>{const was=P.role;P.role=v&&ROLES[v]?v:null;if(!was&&P.role)P.showRole=true;playerRender();}));
}
// Lee de la base de datos el voto y la respuesta propios: así se recuperan al reconectarse.
function syncMine(){
  const pb=P.pub; if(!pb)return;
  const vk=['dilema','consecuencia'].includes(pb.fase)?'r'+pb.ronda:null;
  if(vk!==P.vk){P.vk=vk;P.vUn&&P.vUn();P.vUn=null;P.mv=null;
    if(vk)P.vUn=DB.on(`salas/${P.code}/votos/${vk}/${P.pid}`,v=>{P.mv=v===null||v===undefined?null:String(v);delete P.pend[vk];playerRender();});}
  const qk=pb.quiz?'q'+pb.quiz.n:null;
  if(qk!==P.qk){P.qk=qk;P.qUn&&P.qUn();P.qUn=null;P.ma=null;
    if(qk)P.qUn=DB.on(`salas/${P.code}/quiz/${qk}/${P.pid}`,v=>{P.ma=v===null||v===undefined?null:String(v);delete P.pend[qk];playerRender();});}
}

function markState(box,v){const st=scoreState(v);box.classList.toggle('ok',st.c==='ok');box.classList.toggle('risk',st.c==='risk');const b=box.querySelector('.st');if(b)b.textContent=st.t;
  box.setAttribute('aria-label',`${box.dataset.n}: ${v} de 100${st.c==='ok'?', meta alcanzada':st.c==='risk'?', en zona de riesgo':''}`);}
function setScores(sc){
  const el=document.getElementById('scores');
  if(!sc){el.innerHTML="";_prevSc=null;return;}
  const items=[["💰 Económico","e","eco","var(--eco)"],["🤝 Social","s","soc","var(--soc)"],["🌿 Ambiental","a","amb","var(--amb)"]];
  if(!el.querySelector('.num')){
    el.innerHTML=items.map(([n,k,c,col])=>`<div class="score" role="img" data-k="${k}" data-n="${n.replace(/^\S+ /,'')}"><div class="lab"><span style="color:${col}">${n} <span class="st"></span></span><span class="num" style="color:${col}">${sc[k]}</span></div><div class="bar"><i class="${c}" style="width:${sc[k]}%"></i></div><span class="mark" title="Meta: 60" style="left:calc(16px + (100% - 32px)*.6);top:auto;bottom:12px;height:16px"></span></div>`).join("");
    items.forEach(([n,k])=>markState(el.querySelector(`[data-k="${k}"]`),sc[k]));
    _prevSc={...sc}; return;}
  items.forEach(([n,k])=>{const box=el.querySelector(`[data-k="${k}"]`); if(!box)return; const from=_prevSc?_prevSc[k]:sc[k], to=sc[k]; markState(box,to);
    box.querySelector('.bar i').style.width=to+'%';
    if(from!==to){countUp(box.querySelector('.num'),from,to);const d=document.createElement('span');d.className='dfloat '+(to>from?'up':'down');d.textContent=(to>from?'+':'')+(to-from);box.appendChild(d);setTimeout(()=>d.remove(),2600);}});
  _prevSc={...sc};
}
function countUp(el,a,b){const t0=performance.now(),D=800;const st=n=>{const p=Math.min(1,(n-t0)/D);el.textContent=Math.round(a+(b-a)*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(st);};requestAnimationFrame(st);}

/* ===================== REACCIONES DE LA JUNTA ===================== */
function moodOf(k,fx,flag){
  const w=BOT_W[k]; const v=w.e*fx.e+w.s*fx.s+w.a*fx.a-(flag?w.f:0); return v>3?1:v<-3?-1:0;
}
function shortRole(k){let n=ROLES[k].n.replace(/^Director\(a\) (de )?/,'').replace(/^Representante de (los |la )?/,'').replace(/^Oficial de /,'');return n.charAt(0).toUpperCase()+n.slice(1);}
function rolesInPlay(){if(H.solo)return ROLE_KEYS.slice();const set=new Set(Object.values(roles));(H.bots||[]).forEach(b=>set.add(b.role));return ROLE_KEYS.filter(k=>set.has(k));}
function moodsHTML(fx,flag){
  return `<div class="moods">${rolesInPlay().map((k,i)=>{const m=moodOf(k,fx,flag);
    return `<span class="mood ${m>0?'happy':m<0?'sad':''}" style="animation-delay:${i*.08}s"><span class="ri">${ROLES[k].i}</span>${shortRole(k)} <span class="face">${m>0?'😄':m<0?'😟':'😐'}</span></span>`;}).join("")}</div>`;
}
function myMood(L){
  if(!P.role)return "";
  const m=moodOf(P.role,L.fx,L.flag), n=ROLES[P.role].n;
  return `<div class="moodline ${m>0?'happy':m<0?'sad':'meh'}">${m>0?'😄':m<0?'😟':'😐'} Para tu rol (${n}), esta decisión ${m>0?'te ayuda a cumplir tu objetivo':m<0?'te aleja de tu objetivo':'no cambia mucho'}.</div>`;
}
function stampHTML(fx){
  const pos=[fx.e,fx.s,fx.a].filter(v=>v>0).length, neg=[fx.e,fx.s,fx.a].filter(v=>v<0).length, t=fx.e+fx.s+fx.a;
  if(neg===0&&pos>0)return `<span class="stamp good">✓ Impacto positivo</span>`;
  if(pos===0&&neg>0)return `<span class="stamp bad">✗ Impacto negativo</span>`;
  return `<span class="stamp ${t>=0?'mixed':'bad'}">⚖ Impacto mixto</span>`;
}

/* ========================= GRÁFICA FINAL ========================= */
function chartSVG(hist,pre,dark){
  const W=440,Hh=210,pl=30,pr=12,pt=12,pb=26,n=hist.length;
  const x=i=>pl+(W-pl-pr)*i/Math.max(1,n-1), y=v=>pt+(Hh-pt-pb)*(1-v/100);
  const g=dark?'#4a423c':'#efe6da', tx=dark?'#cbbfb2':'#8a7d70';
  let s=`<svg viewBox="0 0 ${W} ${Hh}" xmlns="http://www.w3.org/2000/svg">`;
  [0,50,100].forEach(v=>{s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="${g}"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="${tx}" font-family="DM Sans,sans-serif">${v}</text>`;});
  s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(60)}" y2="${y(60)}" stroke="${tx}" stroke-dasharray="4 4" opacity=".7"/>`;
  hist.forEach((_,i)=>{s+=`<text x="${x(i)}" y="${Hh-8}" text-anchor="middle" font-size="10" fill="${tx}" font-family="DM Sans,sans-serif">${i===0?'Inicio':i}</text>`;});
  [["e","#b07a1c","#e0a84a"],["s","#b04a3a","#e07a66"],["a","#3c7a55","#6fb08a"]].forEach(([k,c,cd],j)=>{
    const key=pre?('r'+k):k, col=dark?cd:c;
    const d=hist.map((h,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(h[key]).toFixed(1)}`).join(" ");
    s+=`<path class="line" d="${d}" stroke="${col}" style="animation-delay:${j*.3}s"/>`;
    const last=hist[n-1][key]; s+=`<circle cx="${x(n-1)}" cy="${y(last)}" r="4" fill="${col}"/>`;
  });
  return s+`</svg>`;
}

function endingOf(st){
  const {e,s,a}=st.sc, m=Math.min(e,s,a), f=(st.fired||[]).length, all=e>=60&&s>=60&&a>=60;
  let k="medio";
  if(e<15||m<12)k="cierre";
  else if(f>=2)k="escandalo";
  else if(all&&st.finalChoice===2&&f<=1)k="modelo";
  else if(all)k="sostenible";
  else if(e>=60&&(s<45||a<45))k="solitaria";
  else if(e<40&&s>=55&&a>=55)k="rescate";
  else if(a>=70)k="verde";
  else if(s>=65&&a<40)k="gente";
  return {k,...ENDINGS[k]};
}
function endingHTML(){
  const E=ENDINGS[H.ending], parts=E.txt.split(/(?<=\.)\s+/);
  return `<div class="card fade ending ${E.mood}"><span class="tag">Epílogo · cinco años después</span>
    <div class="endhead"><div class="endico">${E.ico}</div><h2 class="endtitle">${E.t}</h2></div>
    ${veredaSVG({...H,ending:H.ending,fase:'epilogo'})}
    <div class="endtext">${parts.map((s,i)=>`<p class="tw" style="animation-delay:${.8+i*1.3}s">${s}</p>`).join("")}</div>

}
